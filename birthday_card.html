<div class="hint" id="hint">Tap or swipe to open</div>
<script>
var card=document.getElementById('card'),hint=document.getElementById('hint');
function set(o){card.classList.toggle('open',o);hint.textContent=o?'Tap or swipe right to close':'Tap or swipe to open';}
function toggle(){set(!card.classList.contains('open'));}
var sx=null,moved=false;
card.addEventListener('pointerdown',function(e){sx=e.clientX;moved=false;});
card.addEventListener('pointerup',function(e){
  if(sx===null)return;var dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>40){moved=true;set(dx<0);}else{toggle();}
});
card.addEventListener('pointercancel',function(){sx=null;});
card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
</script></body></html>
